<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 + user-scalable=no : empêche le zoom au double-tap sur iOS.
         viewport-fit=cover : on gère nous-mêmes les encoches (env(safe-area-inset-*)). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#03170F" />
    <meta name="description" content="Le poker à symboles de Luigi, jouable au doigt." />

    <!-- Installation comme application (Android : manifeste, iOS : métas Apple) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Picture Poker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Luigi's Picture Poker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
